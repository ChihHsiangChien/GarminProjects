<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1A1D21" />
      <stop offset="100%" stop-color="#0F1114" />
    </radialGradient>
    
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A2E35" stroke-width="0.5"/>
    </pattern>
    
    <filter id="ellipseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  <rect width="100%" height="100%" fill="url(#gridPattern)" opacity="0.6"/>

  <g transform="translate(150, 60)">
    <circle cx="300" cy="300" r="310" fill="#222" stroke="#3A3A3A" stroke-width="8"/>
    <circle cx="300" cy="300" r="290" fill="#000" stroke="#111" stroke-width="4"/>
    
    <g transform="translate(300, 300)">
      <rect x="-200" y="-200" width="400" height="400" fill="none" stroke="#333" stroke-width="1"/>
      <line x1="-200" y1="200" x2="200" y2="-200" stroke="#444" stroke-width="1.5" stroke-dasharray="8,8"/>
      
      <g filter="url(#ellipseGlow)">
        <ellipse cx="20" cy="-20" rx="140" ry="70" transform="rotate(-45 20 -20)" fill="none" stroke="#007BFF" stroke-width="6" opacity="0.8"/>
      </g>
      
      <circle cx="-130" cy="90" r="3" fill="#555"/>
      <circle cx="-90" cy="140" r="3" fill="#555"/>
      <circle cx="-50" cy="30" r="3" fill="#555"/>
      <circle cx="40" cy="160" r="3" fill="#555"/>
      <circle cx="110" cy="10" r="3" fill="#555"/>
      
      <circle cx="-70" cy="20" r="4" fill="#AAA"/>
      <circle cx="-20" cy="80" r="4" fill="#AAA"/>
      <circle cx="30" cy="-40" r="4" fill="#AAA"/>
      <circle cx="90" cy="-90" r="4" fill="#AAA"/>
      
      <circle cx="120" cy="-130" r="7" fill="#28A745"/>
      
      <polyline points="120,-130 90,-90 30,-40 -20,80 -70,20" fill="none" stroke="#AAA" stroke-width="2.5" stroke-opacity="0.7"/>
    </g>
    
    <rect x="590" y="180" width="25" height="60" rx="8" fill="#3A3A3A"/>
    <rect x="590" y="360" width="25" height="60" rx="8" fill="#3A3A3A"/>
  </g>

  <g transform="translate(900, 150)">
    <path d="M 50 400 Q 150 250, 100 150 Q 50 50, 250 100 Q 400 150, 350 300 Z" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="10,10" opacity="0.4"/>
    
    <g transform="translate(0, 0)">
      <circle cx="40" cy="40" r="20" fill="none" stroke="#007BFF" stroke-width="3"/>
      <text x="80" y="48" fill="#E0E0E0" font-family="Montserrat, Roboto, Helvetica, sans-serif" font-size="36" font-weight="bold">SD1 / SD2 Ellipse</text>
    </g>
    
    <g transform="translate(0, 120)">
      <circle cx="40" cy="40" r="20" fill="none" stroke="#FF8C00" stroke-width="3"/>
      <text x="80" y="48" fill="#E0E0E0" font-family="Montserrat, Roboto, Helvetica, sans-serif" font-size="36" font-weight="bold">ASM Trajectory</text>
    </g>
    
    <g transform="translate(0, 240)">
      <circle cx="40" cy="40" r="20" fill="none" stroke="#FFC107" stroke-width="3"/>
      <text x="80" y="48" fill="#E0E0E0" font-family="Montserrat, Roboto, Helvetica, sans-serif" font-size="36" font-weight="bold">Energy vs Balance</text>
    </g>
  </g>

  <g transform="translate(80, 600)">
    <text x="0" y="40" fill="#FFF" font-family="Montserrat, Roboto, Helvetica, sans-serif" font-size="56" font-weight="bold">POINCARÉ HRV VISUALIZER</text>
    <text x="0" y="85" fill="#AAAAAA" font-family="Montserrat, Roboto, Helvetica, sans-serif" font-size="32">Real-time Autonomic Nervous System Insights</text>
  </g>
  
  <g transform="translate(1250, 630)">
    <circle cx="0" cy="0" r="15" fill="#28A745" filter="url(#ellipseGlow)"/>
    <text x="30" y="10" fill="#28A745" font-family="Montserrat, Roboto, Helvetica, sans-serif" font-size="28" font-weight="bold">LIVE SIGNAL</text>
  </g>

</svg>
